name: Alien PvP validation

on:
  push:
    branches:
      - feature/alien-vs-survivors
  pull_request:
    paths:
      - 'AIMP.Launcher/**'
      - 'AIMP.Native/**'
      - '.github/workflows/alien-pvp-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-native:
    # Pin VS 2022: windows-latest now ships VS 2026, which cannot
    # satisfy the certified x86 VS 2022 generator used by AIMP.Native.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore 32-bit injector dependency
        shell: pwsh
        run: dotnet restore AIMP.Launcher/src/AIMP.Injector32/AIMP.Injector32.csproj
      - name: Build .NET launcher and protocol test runner
        shell: pwsh
        run: dotnet build AIMP.Launcher/tests/AIMP.Protocol.Tests/AIMP.Protocol.Tests.csproj -c Release
      - name: Verify Alien PvP protocol and multi-round tests
        shell: pwsh
        run: dotnet run --project AIMP.Launcher/tests/AIMP.Protocol.Tests/AIMP.Protocol.Tests.csproj -c Release --no-build -- --filter "Alien PvP"
      - name: Configure native x86 engine module
        shell: pwsh
        run: cmake -S AIMP.Native -B AIMP.Native/build-ci -G "Visual Studio 17 2022" -A Win32 -DBUILD_TESTING=ON
      - name: Build native AISync and probe
        shell: pwsh
        run: cmake --build AIMP.Native/build-ci --config Release --target AIMP.NetZ --parallel 2
      - name: Build and run native Alien movement math tests
        shell: pwsh
        run: |
          cmake --build AIMP.Native/build-ci --config Release --target AIMP.AlienPvPMovementTests --parallel 2
          ctest --test-dir AIMP.Native/build-ci -C Release -R "^AlienPvPMovement$" --output-on-failure
